<h2>PELÍCULAS EN CARTELERA</h2>

<section class="main">

    <div class="hero">
        
    </div>

    <div class="linea-separadora"></div>

    <h3>PELÍCULAS MÁS VENDIDAS</h3>

    <div class="grid">
        @for (p of top3(); track p.id) {
            <a [routerLink]="['/peliculas', p.id]">
                <app-pelicula-card [pelicula]="p" />
            </a>
        }
    </div>

    <div class="linea-separadora"></div>

    <input 
        type="text"
        placeholder="Buscar película o género..."
        [value]="texto()"
        (input)="texto.set($any($event.target).value)"
    />
    
    <div class="generos">
        @for (g of generosDisponibles(); track g) {
            <button
                type="button"
                class="chip"
                [class.selected]="generoSeleccionado()?.id === g.id"
                (click)="elegirGenero(g)">
                {{ g.nombre }}
            </button>
        }
    </div>

    <div class="linea-separadora"></div>
    
    <div class="grid">
        @for (p of peliculasFiltradas(); track p.id) {
            <a [routerLink]="['/peliculas', p.id]">
                <app-pelicula-card [pelicula]="p"/>
            </a>
        } @empty {
            <p class="empty">No se encontraron películas con ese criterio.</p>
        }
    </div>
</section>
