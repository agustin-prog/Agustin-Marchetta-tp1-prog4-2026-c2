<article class="card">
    <img [src]="pelicula().posterUrl" [alt]="pelicula().nombre"/>

    <div class="body">

        <h3>{{ pelicula().nombre }}</h3>

        <div class="meta">

            <div>
                @if (pelicula().restriccionEdad !== "ninguna"){
                    <span class="badge restriccion">{{ pelicula().restriccionEdad }}</span>
                }@else {
                    <span class="badge"></span>
                }
            </div>

            <div>

                <p class="generos">{{ pelicula().generos.map((g) => g.nombre ).join(", ") }}</p>
            </div>
        </div>

        <!-- <p class="generos">{{ pelicula().generos.map((g) => g.nombre ).join(", ") }}</p> -->
    </div>
</article>
